name: Deploy site to GitHub Pages

# The docs site lives in site/ and renders skills/*/SKILL.md verbatim, so a
# change to any skill republishes the page for that skill.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'skills/**'
      - 'evals/routing.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
